name: Project 1 - Network Validation Pipeline

on:
  push:                       # Triggers automatically on every code push
  workflow_dispatch:          # Enables a manual "Run workflow" button in GitHub

permissions:
  id-token: write
  contents: read
  actions: read 

jobs:
  validate-network:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull the main.bicep file from your repo
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Log into Azure safely using your stored OIDC secrets
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 3. Create the testing Resource Group container if it doesn't exist (FREE)
    - name: Ensure Resource Group Exists
      run: |
        az group create --name RG-Enterprise-Networking --location eastus

    # 4. Check the Hub-Spoke Network logic (Does not deploy resources = 100% FREE)
    - name: Validate Bicep Routing Logic
      run: |
        az deployment group validate \
          --resource-group RG-Enterprise-Networking \
          --template-file main.bicep
